# The URL the site will be built for
base_url = "/"

title = "mono"
description = "A documentation and blog theme for Zola, styled as a printed catalog."

default_language = "en"

generate_feeds = true
feed_filenames = ["atom.xml"]

compile_sass = true
minify_html = false

taxonomies = [
  {name = "tags"},
  {name = "categories"},
]

build_search_index = true

[markdown]
insert_anchor_links = "right"
bottom_footnotes = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-light"

[search]
index_format = "elasticlunr_javascript"

[extra]
# Text in the top-left corner, and its destination.
logo_text = "mono"
logo_home_link = "/"

# Collapse the navigation into the Menu toggle at every width.
compact_nav = true

# Top-level navigation. `section` marks the entry as current when the path starts with its URL.
# Set `trailing_slash = false` for file URLs such as the feed.
main_menu = [
  # {url = "/docs/", name = "Docs", section = "docs"},
  {url = "/blog/", name = "Blog", section = "blog"},
  {url = "/tags/", name = "Tags", section = "tags"},
  {url = "/categories/", name = "Categories", section = "categories"},
]

github_url = "https://github.com/gicrisf/mono"

# Documentation section used by the docs layout.
docs_section = "docs"

# Optional page action shown on documentation pages.
edit_page = false
docs_repo = "https://github.com/gicrisf/mono"
repo_branch = "main"

# Footer contents, rendered as HTML.
copyright = 'mono · <a href="https://github.com/gicrisf/mono/blob/main/LICENSE">MIT License</a>'

# Optional custom CSS placed in static/.
# custom_css = "custom.css"

# Optional favicon placed in static/.
favicon = "favicon.svg"
