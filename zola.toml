# The URL the site will be built for
base_url = "/"

title = "Ondine"
description = "A documentation and blog theme for Zola, styled as a printed catalog."

default_language = "en"

generate_feeds = true
feed_filenames = ["atom.xml"]

compile_sass = true
minify_html = false

taxonomies = [
  {name = "tags"},
  {name = "categories"},
]

build_search_index = true

[markdown]
insert_anchor_links = "right"

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-light"

[search]
index_format = "elasticlunr_javascript"

[extra]
# Text in the top-left corner, and its destination.
logo_text = "Ondine"
logo_home_link = "/"

# Top-level navigation. `section` marks the entry as current when the path starts with its URL.
main_menu = [
  {url = "/docs/", name = "Docs", section = "docs"},
  {url = "/blog/", name = "Blog", section = "blog"},
]

github_url = "https://github.com/wevm/ondine"

# Documentation section used by the sidebar and pager.
docs_section = "docs"

# Optional page action shown on documentation pages.
edit_page = false
docs_repo = "https://github.com/wevm/ondine"
repo_branch = "main"

# Footer contents, rendered as HTML.
copyright = 'Ondine · <a href="https://github.com/wevm/ondine/blob/main/LICENSE">MIT License</a>'

# Optional custom CSS placed in static/.
# custom_css = "custom.css"

# Optional favicon placed in static/.
favicon = "favicon.svg"
