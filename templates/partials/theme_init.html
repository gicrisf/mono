{%- if config.extra.theme_switcher %}
<script>
(function () {
    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (error) {}
    var theme = stored === 'dark' || stored === 'light'
        ? stored
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

    document.documentElement.setAttribute('data-theme', theme);

    var darkLink = document.getElementById('giallo-dark');
    var lightLink = document.getElementById('giallo-light');
    if (darkLink) darkLink.disabled = theme !== 'dark';
    if (lightLink) lightLink.disabled = theme === 'dark';
})();
</script>
{%- endif %}
