{% if paginator is defined and (paginator.previous or paginator.next) %}
<nav class="pagination" aria-label="Blog pages">
  {% if paginator.previous %}
  <a class="pagination__link" href="{{ paginator.previous | safe }}" rel="prev">← Newer</a>
  {% else %}
  <span></span>
  {% endif %}

  {% if paginator.next %}
  <a class="pagination__link pagination__link--next" href="{{ paginator.next | safe }}" rel="next">Older →</a>
  {% endif %}
</nav>
{% endif %}
