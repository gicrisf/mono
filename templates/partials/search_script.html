{% if config.build_search_index %}
<script defer src="{{ get_url(path='elasticlunr.min.js') }}"></script>
{% if config.default_language and config.default_language != "en" %}
{% set search_index_file = "search_index." ~ config.default_language ~ ".js" %}
<script defer src="{{ get_url(path=search_index_file) }}"></script>
{% else %}
<script defer src="{{ get_url(path='search_index.en.js') }}"></script>
{% endif %}
<script defer src="{{ get_url(path='assets/js/search.js') }}"></script>
{% endif %}
