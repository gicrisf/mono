<div class="input-group">
    <input id="page-url" type="text" value="{{ current_url }}" readonly aria-label="Page URL">
    <button class="action" type="button" data-copy-url>Copy</button>
</div>

<script>
(function () {
    var button = document.querySelector('[data-copy-url]');
    var input = document.getElementById('page-url');
    if (!button || !input) return;

    button.addEventListener('click', function () {
        var url = window.location.href;

        function done() {
            button.textContent = 'Copied';
            window.setTimeout(function () { button.textContent = 'Copy'; }, 1500);
        }

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(url).then(done);
            return;
        }

        input.select();
        document.execCommand('copy');
        done();
    });
})();
</script>
