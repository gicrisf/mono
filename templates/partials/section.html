<article class="post">
    <header>
        <h1 class="post-title">
            <a href="{{ section.permalink }}">{{ section.title }}</a>
        </h1>
        <div class="post-meta">
            {%- if section.extra.date is defined %}
            <span class="post-date">{{ section.extra.date | date(format="%Y.%m.%d") }}</span>
            {%- endif %}
            {%- if config.extra.show_author %}
            <span class="post-author">{{ config.extra.author }}</span>
            {%- endif %}
        </div>
    </header>

    <div class="post-content">
        {{ section.content | safe }}
    </div>
</article>
