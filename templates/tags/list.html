{% extends "index.html" %}

{% block main %}
<article class="page-single">
  {{<breadcrumb.trail title="Tags" ancestors={[]} base_url={config.base_url} />}}

  <header class="page-header">
    <h1>Tags</h1>
  </header>

  <div class="prose">
    <ul>
      {% for term in terms %}
      <li><a href="{{ get_taxonomy_url(kind='tags', name=term.name) }}">#{{ term.name }}</a> ({{ term.pages | length }})</li>
      {% endfor %}
    </ul>
  </div>
</article>
{% endblock main %}
