{% extends "index.html" %}

{%- block title -%}
<title>Tags - {{ config.title }}</title>
{%- endblock title -%}

{%- block main -%}
<article class="post">
    <h1 class="post-title">Tags</h1>
    <ul>
        {%- for term in terms -%}
        <li class="tag-list">
            <a href="{{ get_taxonomy_url(kind="tags", name=term.name) }}">#{{ term.name }}</a>
            ({{ term.pages | length }} post{{ term.pages | length | pluralize }})
        </li>
        {%- endfor -%}
    </ul>
</article>
{%- endblock main -%}
