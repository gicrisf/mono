{% extends "index.html" %}

{% block main %}
<article class="page-single">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.description %}
    <p class="page-lede">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="prose">
    {{ page.content | safe }}
  </div>
</article>
{% endblock main %}
