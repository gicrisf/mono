{%- component toc.toc(t) -%}
{%- if t -%}
<nav class="toc" id="nav-container" aria-label="Table of contents">
    <p class="toc-head">On this page</p>
    <div id="nav-content">
        {{<toc.items items={t} />}}
    </div>
</nav>
{%- endif -%}
{%- endcomponent toc.toc -%}

{%- component toc.items(items) -%}
<ul>
    {%- for item in items -%}
    <li>
        <a href="{{ item.permalink | safe }}">{{ item.title }}</a>
        {%- if item.children -%}
        {{<toc.items items={item.children} />}}
        {%- endif -%}
    </li>
    {%- endfor -%}
</ul>
{%- endcomponent toc.items -%}
